<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jogo de estratégia sobre ação climática — ODS 13. Projeto de sala de aula, UniSENAI."
    />
    <title>Ponto de Virada</title>
  </head>
  <body>
    <!-- Só a estrutura. O conteúdo do HUD, da barra de tempo e da árvore é
         montado pelos módulos de src/ui/ a partir do src/data/i18n.ts — rótulo
         e nome de nó são texto de UI, e a regra 8 não deixa eles morarem aqui.

         O nome do jogo é a exceção deliberada: ele precisa estar no <title> de
         qualquer jeito, e manter os dois <h1> ao lado é menos duplicação do que
         espalhá-los por outro arquivo. São três ocorrências, todas neste
         arquivo, e o P1-04 troca as três de uma vez.

         As três telas do P5-06 são feitas destes blocos: #tela-titulo, o .topo,
         a .base e o #tabuleiro. Quem liga e desliga cada um é o
         src/ui/screens.ts, pelo atributo hidden — o porquê de cada tela mostrar
         o que mostra está escrito lá. -->
    <!-- O link de pulo do P8-04. Primeiro elemento do corpo porque precisa ser a
         primeira parada de tabulação da página — é essa posição que faz dele um
         atalho e não mais um item da fila. Fica invisível até receber o foco
         (src/ui/skip-link.css) e quem o preenche é o src/ui/skip-link.ts.

         O roteador o liga e desliga junto com o tabuleiro: no título e na tela
         de fim não há bloco nenhum para contornar. -->
    <nav id="pular" class="pular" hidden></nav>

    <section id="tela-titulo" class="title">
      <h1 class="title__name">Ponto de Virada</h1>
    </section>

    <!-- A partida em três faixas (VIS-04): a barra de cima, o meio e a barra de
         baixo. Em tela larga elas enchem a janela; em tela estreita viram uma
         coluna só (src/ui/layout.css). O invólucro nunca some — o roteador só
         escreve nele qual tela está no ar. -->
    <div id="tela-partida" class="partida">
      <header class="topo">
        <h1 class="topo__titulo">Ponto de Virada</h1>
        <div id="hud" class="hud"></div>
        <div id="partida" class="session"></div>
      </header>

      <main id="app" class="conteudo">
        <!-- O resultado fica FORA do #tabuleiro de propósito: a tela de fim
             esconde o tabuleiro e mantém o resultado. Quem manda no hidden dele
             é o renderOutcome, e não o roteador — dois donos do mesmo atributo
             se apagariam um ao outro, um por quadro (src/ui/screens.ts). -->
        <section id="resultado" class="outcome"></section>

        <!-- O tabuleiro: tudo que só faz sentido com a partida em curso. É o
             bloco que a tela de fim desliga inteiro. Existe como invólucro
             porque o #eventos já tem dono do próprio hidden (o
             renderEventCards), então o roteador não pode mexer nas seções uma a
             uma. -->
        <div id="tabuleiro" class="tabuleiro">
          <!-- O mundo: o mapa e, ao lado dele, a região escolhida e o boletim.
               A ordem é a de leitura da tela — o desenho primeiro, depois a
               coluna, de cima para baixo. -->
          <div class="tabuleiro__mundo">
            <div class="tabuleiro__palco">
              <section id="mapa" class="map"></section>
            </div>
            <div class="tabuleiro__lado">
              <!-- O detalhe vem ao lado do mapa, na mesma altura: clicar numa
                   região e ler o número dela é um par que precisa caber na
                   mesma tela. Aparece com a frase que ensina o clique desde
                   2025, pela mesma razão da contenção bloqueada — um painel que
                   só existe depois do primeiro clique não tem como ensinar que
                   o clique existe. -->
              <section id="regiao" class="region"></section>
              <!-- O boletim de eventos, embaixo do detalhe. Fica escondido
                   enquanto não cai evento; quando o tempo para sozinho por
                   causa de um, o aviso aparece aqui, ao lado do mapa. -->
              <section id="eventos" class="events" hidden></section>
            </div>
          </div>
        </div>
      </main>

      <!-- A barra de baixo: o tempo, as listras da partida e o caminho até a
           árvore. Vem depois do meio no código porque vem depois dele na tela;
           os atalhos de teclado do tempo valem de qualquer lugar da página. -->
      <div id="base" class="base">
        <div id="controles" class="ctl"></div>
        <div id="listras" class="stripes"></div>
        <div id="atalho-arvore" class="base__arvore"></div>
      </div>

      <!-- O painel da árvore (VIS-05): o que fazer a respeito, por cima da
           partida. Fica fora do meio de propósito — o meio rola e é contêiner
           de tamanho, e o painel precisa cobrir a janela inteira. Quem o abre é
           o botão da barra de baixo, e quem o fecha é o botão dele, o clique no
           fundo ou o Esc (src/ui/tree-panel.ts).

           Os losangos à esquerda; à direita, o detalhe do nó escolhido e, embaixo
           dele, a contenção. A contenção fica ao lado da compra porque compete
           com ela: gastar PAC aqui é não comprar um nó neste mês (docs/GDD.md
           §2.6). Aparece bloqueada desde 2025 de propósito — é ela que ensina que
           o ramo Sociedade destrava alguma coisa. -->
      <div id="painel-arvore" class="tree-panel" hidden>
        <div class="tree-panel__dialog" role="dialog" aria-modal="true">
          <header class="tree-panel__head" data-tree-panel="head"></header>
          <section id="arvore" class="tree"></section>
          <div class="tree-panel__side">
            <section id="detalhe-no" class="skill-detail"></section>
            <section id="contencao" class="contain"></section>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
