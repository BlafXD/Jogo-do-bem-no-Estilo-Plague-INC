<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jogo de estratégia sobre ação climática — ODS 13. Projeto de sala de aula, UniSENAI."
    />
    <title>Ponto de Virada</title>
  </head>
  <body>
    <!-- Só a estrutura. O conteúdo do HUD é montado pelo src/ui/hud.ts a partir
         do src/data/i18n.ts — rótulo de indicador é texto de UI, e a regra 8
         não deixa ele morar aqui.

         O nome do jogo é a exceção deliberada: ele precisa estar no <title> de
         qualquer jeito, e manter o <h1> ao lado é menos duplicação do que
         separar os dois. Muda quando o P1-04 decidir o nome definitivo. -->
    <header class="topo">
      <h1 class="topo__titulo">Ponto de Virada</h1>
      <div id="hud" class="hud" aria-label="Indicadores da partida"></div>
    </header>

    <main id="app" class="conteudo"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
